name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ELASTICSEARCH_NODE: http://localhost:9200
      ELASTICSEARCH_PRODUCT_INDEX: products
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -sSf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s' >/dev/null"
          --health-interval 10s
          --health-timeout 60s
          --health-retries 6
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed Elasticsearch (smoke test of the seed script)
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e
